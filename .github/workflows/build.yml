
name: Build Cross-Platform App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name MyApp app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-${{ matrix.name }}
          path: dist/*
